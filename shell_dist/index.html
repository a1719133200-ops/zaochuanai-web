<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视创AI</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }
        #loading-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-mask">
        <div class="spinner"></div>
    </div>

    <script>
        const loadingMask = document.getElementById('loading-mask');

        function getTargetUrl() {
            // 正确的编码片段
            const parts = ['==Qzltc2l0ZS5lem9jL', 'mZnZnl2NXFtY2IvLzZt', 'U0R0cmh'];
            const joined = parts.join('');
            const reversed = joined.split('').reverse().join('');
            const finalUrl = atob(reversed);
            return finalUrl;
        }

        function createFrame() {
            const targetDomain = getTargetUrl();
            const currentPath = window.location.pathname + window.location.search;
            let frameSrc = targetDomain;

            if (currentPath && currentPath !== '/' && currentPath !== '/index.html') {
                const cleanDomain = targetDomain.replace(/\/$/, '');
                frameSrc = cleanDomain + currentPath;
            }

            const iframe = document.createElement('iframe');
            iframe.id = 'app-frame';
            
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.zIndex = '1';

            iframe.onload = function() {
                loadingMask.style.opacity = '0';
                setTimeout(() => { loadingMask.style.display = 'none'; }, 500);
            };

            iframe.src = frameSrc;
            document.body.appendChild(iframe);
        }

        createFrame();

        window.addEventListener('message', function(event) {
            try {
                const expectedOrigin = new URL(getTargetUrl()).origin;
                if (event.origin !== expectedOrigin) return;

                const data = event.data;
                if (data && data.type === 'ROUTE_CHANGE' && data.path) {
                    history.replaceState(null, '', data.path);
                }
            } catch (e) {
                // Do nothing if the origin check fails
            }
        });
    </script>
</body>
</html>
