<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视创AI</title>
    <!-- 如果你有图标，确保 logo.png 也在 shell_dist 文件夹里 -->
    <link rel="icon" href="/logo.png" type="image/png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        
        /* iframe 全屏样式 */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1;
        }

        /* 加载动画样式 */
        #loading-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div id="loading-mask">
        <div class="spinner"></div>
    </div>

    <!-- Iframe will be dynamically inserted here by the script -->

    <script>
        const loadingMask = document.getElementById('loading-mask');

        // --- 核心混淆逻辑 ---
        function getTargetUrl() {
            // 1. 字符串被分割存放在数组中
            const parts = ['==Qzltc2l6', 'LmNvemUuZ2Z5dm', '5xc21jYi8v', 'M01zaHRh'];
            
            // 2. 运行时拼接
            const joined = parts.join('');
            
            // 3. 运行时反转字符串，得到真正的 Base64
            const reversed = joined.split('').reverse().join('');
            
            // 4. Base64 解码得到最终 URL
            const finalUrl = atob(reversed);
            
            return finalUrl;
        }

        function createFrame() {
            const targetDomain = getTargetUrl();
            const currentPath = window.location.pathname + window.location.search;
            let frameSrc = targetDomain;

            if (currentPath && currentPath !== '/' && currentPath !== '/index.html') {
                const cleanDomain = targetDomain.replace(/\/$/, '');
                frameSrc = cleanDomain + currentPath;
            }

            // 动态创建 iframe
            const iframe = document.createElement('iframe');
            iframe.id = 'app-frame';
            iframe.src = frameSrc;
            
            // 设置样式
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.zIndex = '1';

            // 插入到 body 的 loading-mask 之后
            const loadingMaskElement = document.getElementById('loading-mask');
            loadingMaskElement.insertAdjacentElement('afterend', iframe);

            // 监听加载并隐藏动画
            iframe.onload = function() {
                loadingMask.style.opacity = '0';
                setTimeout(() => { loadingMask.style.display = 'none'; }, 500);
            };
        }

        // 启动
        createFrame();

        // --- 路由同步逻辑 ---
        window.addEventListener('message', function(event) {
            // 安全检查：为了确保安全，最好检查消息来源
            // const expectedOrigin = getTargetUrl();
            // if (event.origin !== new URL(expectedOrigin).origin) return;

            const data = event.data;
            if (data && data.type === 'ROUTE_CHANGE' && data.path) {
                history.replaceState(null, '', data.path);
            }
        });
    </script>
</body>
</html>
